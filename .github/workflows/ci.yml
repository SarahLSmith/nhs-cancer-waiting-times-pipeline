# Continuous integration: runs on every pull request.
#
# It checks formatting and runs the automated tests. It does not download the NHS
# files (about 250 MB), so it stays fast and does not depend on the NHS website.
# The full pipeline is run locally with `python -m pipeline`.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb dbt-core dbt-duckdb pyyaml requests pytest black

      - name: Check formatting (black)
        run: python -m black --check .

      - name: Run tests
        run: python -m pytest -q
